name: Shell code scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    # 課金を避けるため、公開リポジトリの標準runnerでだけ実行し、非公開化されたら実行しない。
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze shell entry points
        run: |
          shellcheck --version
          python3 .github/scripts/shellcheck_sarif.py hooks/scripts/post-edit.sh hooks/scripts/format-lint.sh > "$RUNNER_TEMP/shellcheck.sarif"
      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/shellcheck.sarif
          category: shellcheck
          wait-for-processing: true
